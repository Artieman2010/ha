<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Flashlight Control</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        button {
            background: linear-gradient(145deg, #ff6b6b, #feca57);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .flashlight-btn {
            background: linear-gradient(145deg, #4ecdc4, #44a08d);
        }

        .stop-btn {
            background: linear-gradient(145deg, #fc4a1a, #f7b733);
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 16px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Camera Flashlight</h1>
        
        <div class="warning">
            ⚠️ <strong>Note:</strong> This uses the camera with flash/torch mode. Direct flashlight control isn't available in web browsers for security reasons.
        </div>

        <div class="status" id="status">
            Click "Start Camera" to begin
        </div>

        <video id="video" style="display: none;" playsinline></video>

        <div class="controls">
            <button id="startBtn" onclick="startCamera()">
                📷 Start Camera
            </button>
            
            <button id="flashBtn" class="flashlight-btn" onclick="toggleFlash()" disabled>
                💡 Turn On Flash
            </button>
            
            <button id="stopBtn" class="stop-btn" onclick="stopCamera()" disabled>
                ⏹️ Stop Camera
            </button>
        </div>
    </div>

    <script>
        let stream = null;
        let track = null;
        let isFlashOn = false;

        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const flashBtn = document.getElementById('flashBtn');
        const stopBtn = document.getElementById('stopBtn');

        function updateStatus(message) {
            status.textContent = message;
        }

        async function startCamera() {
            try {
                updateStatus('Requesting camera access...');
                
                // Request camera access with rear camera
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' }, // Rear camera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.style.display = 'block';
                
                // Get the video track
                track = stream.getVideoTracks()[0];
                
                // Check if flash/torch is supported
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    flashBtn.disabled = false;
                    updateStatus('Camera started! Flash control available.');
                } else {
                    updateStatus('Camera started, but flash control not available on this device.');
                }

                startBtn.disabled = true;
                stopBtn.disabled = false;
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                updateStatus('Error: Could not access camera. Please check permissions.');
            }
        }

        async function toggleFlash() {
            if (!track) return;

            try {
                const capabilities = track.getCapabilities();
                if (!capabilities.torch) {
                    updateStatus('Flash not supported on this device.');
                    return;
                }

                isFlashOn = !isFlashOn;
                
                await track.applyConstraints({
                    advanced: [{ torch: isFlashOn }]
                });

                flashBtn.textContent = isFlashOn ? '🔦 Turn Off Flash' : '💡 Turn On Flash';
                updateStatus(isFlashOn ? 'Flash is ON' : 'Flash is OFF');
                
            } catch (error) {
                console.error('Error toggling flash:', error);
                updateStatus('Error controlling flash. Try restarting the camera.');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                track = null;
            }
            
            video.srcObject = null;
            video.style.display = 'none';
            
            isFlashOn = false;
            flashBtn.textContent = '💡 Turn On Flash';
            flashBtn.disabled = true;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            updateStatus('Camera stopped.');
        }

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && stream) {
                stopCamera();
            }
        });

        // Handle beforeunload to clean up resources
        window.addEventListener('beforeunload', function() {
            if (stream) {
                stopCamera();
            }
        });
    </script>
</body>
</html>
